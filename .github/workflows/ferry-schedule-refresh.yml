name: Refresh Ferry Schedule

on:
  schedule:
    # Mondays 04:00 UTC. Every successful run commits (meta.lastChecked changes), which also
    # keeps the repository active so GitHub does not disable this schedule after 60 days.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ferry-schedule-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Update ferry schedule
        # Exits non-zero (and writes nothing) only when every route failed.
        run: npm run update:ferry-schedules

      - name: Commit changes
        run: |
          if git diff --quiet -- src/data/ferryScheduleData.ts; then
            echo "Schedule file unchanged; nothing to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/ferryScheduleData.ts
          git commit -m "chore: refresh ferry schedule data"
          git pull --rebase
          git push
