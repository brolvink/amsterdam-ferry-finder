server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  # PWA: the service worker and manifest must always be revalidated, otherwise
  # a cached sw.js pins users to an old build.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /sw-audio.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /registerSW.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Vite content-hashed build output: safe to cache for a year.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Other static files (not content-hashed): cache for a week, no immutable.
  location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|mp3|woff2?)$ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }
}
